
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-ULTRA AI - API Test</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #080d1c;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .container {
      max-width: 600px;
      margin: 35px auto;
      padding: 22px;
      background: #111a2e;
      border: 1px solid #293653;
      border-radius: 16px;
    }
    h1 { color: #7c91ff; }
    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 9px;
      font-size: 15px;
    }
    input {
      background: #080d1c;
      color: white;
      border: 1px solid #394763;
    }
    button {
      background: #637cff;
      color: white;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #080d1c;
      padding: 14px;
      border-radius: 9px;
      color: #8fffc0;
      min-height: 90px;
    }
    .muted { color: #aab5cc; }
  </style>
</head>
<body>

<div class="container">
  <h1> K-ULTRA AI V252 </h1>
  <h3>Backend Connection Test</h3>

  <p class="muted">Firebase Authentication Status:</p>
  <pre id="authStatus">Checking login...</pre>

  <p class="muted">Enter a test message:</p>
  <input
    id="message"
    type="text"
    value="Hello K-ULTRA AI! Introduce yourself."
    placeholder="Type your message..."
  >

  <button id="testButton" disabled>
    Test Gemini AI Connection
  </button>

  <h3>Backend Response</h3>
  <pre id="result">Waiting for test...</pre>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<!-- Existing Firebase configuration -->
<script src="./assets/js/firebase-config.js"></script>

<script>
"use strict";

const WORKER_URL =
  "https://k-ultra-ai-backend.yeddulakoteswararao.workers.dev";

const authStatus = document.getElementById("authStatus");
const result = document.getElementById("result");
const testButton = document.getElementById("testButton");
const messageInput = document.getElementById("message");

let currentUser = null;

try {
  if (!window.KULTRA_FIREBASE_CONFIG) {
    throw new Error("Firebase configuration file not loaded.");
  }

  if (!firebase.apps.length) {
    firebase.initializeApp(window.KULTRA_FIREBASE_CONFIG);
  }

  const auth = firebase.auth();

  auth.onAuthStateChanged((user) => {
    currentUser = user;

    if (user) {
      authStatus.textContent =
        "SIGNED IN\nEmail: " + (user.email || "Not available");

      testButton.disabled = false;
    } else {
      authStatus.textContent =
        "NOT SIGNED IN\nPlease sign in on the main K-ULTRA AI website first.";

      testButton.disabled = true;
    }
  });

  testButton.addEventListener("click", async () => {
    const message = messageInput.value.trim();

    if (!currentUser) {
      result.textContent = "Please sign in first.";
      return;
    }

    if (!message) {
      result.textContent = "Please enter a message.";
      return;
    }

    testButton.disabled = true;
    result.textContent = "Connecting to Gemini AI...";

    try {
      const idToken = await currentUser.getIdToken();

      const response = await fetch(WORKER_URL + "/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + idToken
        },
        body: JSON.stringify({
          message: message,
          history: []
        })
      });

      const data = await response.json();

      result.textContent = JSON.stringify({
        httpStatus: response.status,
        ...data
      }, null, 2);

    } catch (error) {
      result.textContent =
        "CONNECTION ERROR\n" + error.message +
        "\n\nCheck Worker URL, CORS and internet connection.";
    } finally {
      testButton.disabled = !currentUser;
    }
  });

} catch (error) {
  authStatus.textContent = "INITIALIZATION ERROR\n" + error.message;
  result.textContent = "Please check Firebase configuration.";
}
</script>

</body>
</html>
