
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d1c">
  <title>404 — Page Not Found | K-ULTRA AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #080d1c;
      color: #f5f7ff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      width: min(100%, 560px);
      padding: 36px 24px;
      border: 1px solid #263653;
      border-radius: 22px;
      background: #101a2e;
      box-shadow: 0 20px 60px #0005;
    }

    .logo {
      color: #8ba1ff;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .number {
      margin: 30px 0 8px;
      color: #718cff;
      font-size: clamp(76px, 20vw, 130px);
      font-weight: 900;
      line-height: 1;
    }

    h1 {
      font-size: 26px;
    }

    p {
      color: #aebbd2;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 13px 24px;
      border-radius: 10px;
      background: #637cff;
      color: white;
      text-decoration: none;
      font-weight: 700;
    }

    a:hover {
      background: #4d68ed;
    }
  </style>
</head>

<body>
  <main>
    <div class="logo">K-ULTRA AI</div>

    <div class="number">404</div>

    <h1>Page Not Found</h1>

    <p>
      The page you are looking for does not exist,
      may have moved, or is temporarily unavailable.
    </p>

    <a href="./">Return to K-ULTRA AI Home</a>
  </main>
</body>
</html>
